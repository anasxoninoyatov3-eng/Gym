<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Fytnes</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body {
            padding-top: 2rem;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-table th,
        .user-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-table th {
            color: #7000FF;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        .user-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-active {
            color: #39FF14;
            background: rgba(57, 255, 20, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="bg-glow glow-violet"></div>
    <div class="admin-container">
        <div class="admin-header">
            <h2><span class="text-accent">Admin</span> Panel</h2>
            <a href="index.html" class="btn btn-outline" style="padding: 5px 15px;">Asosiy saytga qaytish</a>
        </div>

        <div class="glass-panel" style="padding: 0;">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>Ism Familiya</th>
                        <th>Email</th>
                        <th>Ro'yxatdan o'tdi</th>
                        <th>Holati</th>
                    </tr>
                </thead>
                <tbody id="admin-user-list">
                    <!-- Namuna malumotlar -->
                    <tr>
                        <td>Ali Valiyev</td>
                        <td>ali.valiyev@gmail.com</td>
                        <td>Bugun, 10:30</td>
                        <td><span class="status-active">Aktiv</span></td>
                    </tr>
                    <tr>
                        <td>Olimjon To'rayev</td>
                        <td>olimjon1990@gmail.com</td>
                        <td>Kecha, 18:45</td>
                        <td><span class="status-active">Aktiv</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
